<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <rect width="1600" height="600" fill="#1a1a1a"/>
  <rect x="0" y="0" width="1600" height="600" fill="url(#grid)" opacity="0.15"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Center box -->
  <rect x="550" y="200" width="500" height="200" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,6" opacity="0.4"/>
  <!-- Icon -->
  <text x="800" y="275" font-family="Arial,sans-serif" font-size="48" fill="#ffffff" opacity="0.3" text-anchor="middle">🍔</text>
  <!-- Main text -->
  <text x="800" y="340" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" opacity="0.7" text-anchor="middle" letter-spacing="4">SNACK ZONE CAROUSEL</text>
  <!-- Size text -->
  <text x="800" y="375" font-family="Arial,sans-serif" font-size="14" fill="#ffffff" opacity="0.4" text-anchor="middle" letter-spacing="2">RECOMMENDED SIZE: 1600 × 600 px</text>
  <!-- Corner labels -->
  <text x="20" y="30" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" opacity="0.3">0,0</text>
  <text x="1540" y="30" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" opacity="0.3" text-anchor="end">1600,0</text>
  <text x="20" y="595" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" opacity="0.3">0,600</text>
  <text x="1540" y="595" font-family="Arial,sans-serif" font-size="12" fill="#ffffff" opacity="0.3" text-anchor="end">1600,600</text>
</svg>
