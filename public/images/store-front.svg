<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="320" width="600" height="80" fill="#111"/>
  <rect x="0" y="318" width="600" height="4" fill="#222"/>
  <!-- Building -->
  <rect x="80" y="120" width="440" height="200" fill="#1e1e1e"/>
  <!-- Roof accent -->
  <rect x="80" y="112" width="440" height="12" fill="#e63946"/>
  <!-- Glow above sign -->
  <rect x="140" y="60" width="320" height="60" fill="url(#glow)" rx="4"/>
  <!-- Sign board -->
  <rect x="140" y="68" width="320" height="52" rx="8" fill="#e63946"/>
  <text x="300" y="102" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="30" fill="#fff" letter-spacing="2">SNACK ZONE</text>
  <!-- Windows -->
  <rect x="110" y="150" width="90" height="70" rx="4" fill="#0d0d0d" stroke="#333" stroke-width="2"/>
  <rect x="255" y="150" width="90" height="70" rx="4" fill="#0d0d0d" stroke="#333" stroke-width="2"/>
  <rect x="400" y="150" width="90" height="70" rx="4" fill="#0d0d0d" stroke="#333" stroke-width="2"/>
  <!-- Window lights -->
  <rect x="110" y="150" width="90" height="70" rx="4" fill="#e63946" fill-opacity="0.08"/>
  <rect x="255" y="150" width="90" height="70" rx="4" fill="#ffd60a" fill-opacity="0.06"/>
  <!-- Door -->
  <rect x="245" y="240" width="110" height="80" rx="4" fill="#111" stroke="#333" stroke-width="2"/>
  <rect x="295" y="240" width="2" height="80" fill="#333"/>
  <circle cx="258" cy="280" r="4" fill="#e63946"/>
  <circle cx="342" cy="280" r="4" fill="#e63946"/>
  <!-- Awning -->
  <path d="M200 232 L400 232 L410 250 L190 250 Z" fill="#e63946"/>
  <line x1="215" y1="232" x2="210" y2="250" stroke="#c1121f" stroke-width="2"/>
  <line x1="245" y1="232" x2="240" y2="250" stroke="#c1121f" stroke-width="2"/>
  <line x1="275" y1="232" x2="270" y2="250" stroke="#c1121f" stroke-width="2"/>
  <line x1="305" y1="232" x2="302" y2="250" stroke="#c1121f" stroke-width="2"/>
  <line x1="335" y1="232" x2="333" y2="250" stroke="#c1121f" stroke-width="2"/>
  <line x1="365" y1="232" x2="365" y2="250" stroke="#c1121f" stroke-width="2"/>
  <line x1="390" y1="232" x2="393" y2="250" stroke="#c1121f" stroke-width="2"/>
  <!-- Neon open sign -->
  <rect x="412" y="160" width="60" height="24" rx="4" fill="none" stroke="#e63946" stroke-width="1.5"/>
  <text x="442" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e63946" font-weight="bold">OPEN</text>
  <!-- Stars rating -->
  <text x="300" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffd60a">★★★★★</text>
  <text x="300" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">5.0 on Google Reviews</text>
</svg>
