<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" rx="24" fill="#1a1a1a"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="345" rx="90" ry="12" fill="#000" fill-opacity="0.4"/>
  <!-- Fries sticking up (back row) -->
  <rect x="140" y="100" width="18" height="130" rx="9" fill="#ffc107"/>
  <rect x="140" y="100" width="18" height="20" rx="9" fill="#ffca28"/>
  <rect x="163" y="88" width="18" height="145" rx="9" fill="#ffb300"/>
  <rect x="163" y="88" width="18" height="22" rx="9" fill="#ffc107"/>
  <rect x="186" y="95" width="18" height="138" rx="9" fill="#ffd54f"/>
  <rect x="186" y="95" width="18" height="20" rx="9" fill="#ffe082"/>
  <rect x="209" y="83" width="18" height="150" rx="9" fill="#ffc107"/>
  <rect x="209" y="83" width="18" height="22" rx="9" fill="#ffca28"/>
  <rect x="232" y="92" width="18" height="141" rx="9" fill="#ffb300"/>
  <rect x="232" y="92" width="18" height="20" rx="9" fill="#ffc107"/>
  <!-- Box body -->
  <path d="M128 220 L145 350 L255 350 L272 220 Z" fill="#e63946"/>
  <!-- Box top fold -->
  <path d="M124 215 L276 215 L272 228 L128 228 Z" fill="#c1121f"/>
