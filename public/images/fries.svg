  <line x1="155" y1="215" x2="148" y2="350" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="185" y1="215" x2="180" y2="350" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="215" y1="215" x2="212" y2="350" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="245" y1="215" x2="244" y2="350" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- SZ logo on box -->
  <text x="200" y="295" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#fff" fill-opacity="0.25">SZ</text>
  <!-- Salt sparkles -->
  <rect x="150" y="108" width="4" height="4" rx="1" fill="#fff" fill-opacity="0.6" transform="rotate(15 150 108)"/>
  <rect x="195" y="96" width="3" height="3" rx="1" fill="#fff" fill-opacity="0.5" transform="rotate(-10 195 96)"/>
  <rect x="230" y="104" width="4" height="4" rx="1" fill="#fff" fill-opacity="0.6" transform="rotate(25 230 104)"/>
